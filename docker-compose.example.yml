name: colab-gpu-studio
x-studio: &studio
  image: colab-gpu-studio:0.2.13
  build: .
  env_file: .env
  environment:
    DATABASE_URL: sqlite:////data/studio.db
    DATA_DIR: /data
  volumes: [studio-data:/data]
  restart: unless-stopped
  mem_limit: 384m
  pids_limit: 128
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
services:
  api:
    <<: *studio
    mem_limit: 1024m
    ports: ["${BIND_IP:-127.0.0.1}:${BIND_PORT:-8788}:8788"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8788/api/health',timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 10
  worker:
    <<: *studio
    mem_limit: 1024m
    command: [python, -m, app.worker, worker]
    depends_on:
      api: {condition: service_healthy}
  watchdog:
    <<: *studio
    command: [python, -m, app.worker, watchdog, --interval, '5']
    depends_on:
      api: {condition: service_healthy}
volumes:
  studio-data:

networks:
  default:
    ipam:
      config:
        - subnet: ${STUDIO_SUBNET:-10.231.88.0/24}
