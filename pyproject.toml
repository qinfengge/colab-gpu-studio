[project]
name = "colab-gpu-studio"
version = "0.2.15"
description = "Independent mobile AI studio with on-demand compute"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2,<3",
    "pydantic-settings>=2.6,<3",
    "cryptography>=43,<46",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9,<1",
    "pillow>=10,<12",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "websockets>=13,<16",
    "kaggle>=2,<3",
]
[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9", "playwright>=1.50"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["api", "."]
asyncio_default_fixture_loop_scope = "function"
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.hatch.build.targets.wheel]
packages = ["api/app"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
